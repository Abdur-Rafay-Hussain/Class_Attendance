[project]
name = "classroom-attendance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdur-Rafay-Hussain", email = "abdurrafayhussain75@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "docx2txt>=0.9",
    "email-validator>=2.3.0",
    "face-recognition>=1.3.0",
    "face-recognition-models",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "passlib[bcrypt]>=1.7.4",
    "pgvector==0.3.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "setuptools<81",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
classroom-attendance = "classroom_attendance:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models.git" }
